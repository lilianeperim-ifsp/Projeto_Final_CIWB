<!DOCTYPE html>
<!-- pages/personagens.html: página de personagens em formato de blog (capa, protagonistas e grade com busca). Esqueleto: Liliane (PR L1). Dona da página: Liliane. -->
<!-- o data-bs-theme="dark" é a reserva para quando o JavaScript não roda; o tema.js sobrescreve -->
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personagens | Diários de Mystic Falls</title>
    <link rel="icon" type="image/png" href="../img/favicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lato:wght@400;700&display=swap">
    <link rel="stylesheet" href="../css/style.css">
    <!-- aplica o tema antes de a página aparecer; por isso fica no head, sem defer (D7) -->
    <script src="../js/tema.js"></script>
</head>
<body>

    <header>
        <nav id="menu" class="navbar navbar-expand-lg" aria-label="Menu principal"></nav>
    </header>

    <!-- pagina-personagens: limita ao Personagens o hover com seta dos cards (style.css) -->
    <main class="container py-4 pagina-personagens">

        <!-- capa no estilo da inicial: foto do elenco (Wikimedia Commons, cópia em img/) e o texto de abertura -->
        <section class="capa row g-4 align-items-center mb-4" aria-labelledby="titulo-pagina">
            <figure class="col-lg-7 mb-0">
                <img class="capa-foto" src="../img/elenco-comic-con.jpg" width="960" height="640" alt="Paul Wesley, Nina Dobrev e Ian Somerhalder, que fazem Stefan, Elena e Damon, num painel da Comic-Con">
                <figcaption class="credito">Foto: <a href="https://commons.wikimedia.org/wiki/File:The_Vampire_Diaries_main_cast_by_Gage_Skidmore.jpg">Gage Skidmore</a>, <a href="https://creativecommons.org/licenses/by-sa/2.0/">CC BY-SA 2.0</a></figcaption>
            </figure>

            <div class="col-lg-5">
                <p class="meta mb-1">Personagens</p>
                <h1 id="titulo-pagina">Quem é quem em Mystic Falls</h1>
                <p class="lead mb-0">Vampiros que chegaram em 1864, bruxas de linhagens antigas, lobisomens, caçadores e os humanos que ficaram no meio disso tudo. Aqui estão os personagens da série, quem os interpreta, a espécie e a família de cada um.</p>
            </div>
        </section>

        <div id="estado"></div>

        <!-- os três protagonistas, montados pelo personagens.js com os três primeiros da lista -->
        <section class="secao-pagina" aria-labelledby="titulo-destaques">
            <h2 id="titulo-destaques" class="h3 mb-3">Os protagonistas</h2>
            <div id="destaques" class="row row-cols-1 row-cols-lg-3 g-3"></div>
        </section>

        <section class="secao-pagina" aria-labelledby="titulo-todos">
            <h2 id="titulo-todos" class="h3 mb-3">Todos os personagens</h2>

            <form id="form-busca" role="search">
                <label for="campo-busca" class="form-label">Buscar personagem pelo nome</label>
                <input type="search" id="campo-busca" class="form-control" autocomplete="off">
            </form>

            <p id="mensagem-busca" aria-live="polite"></p>

            <ul id="lista" class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-3 list-unstyled"></ul>
        </section>

    </main>

    <footer id="rodape"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/cache.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/busca.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/paginas/personagens.js"></script>

</body>
</html>
